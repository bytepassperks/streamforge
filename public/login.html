<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in — Videokr</title>
<link rel="icon" href="/brand/mark-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/mark-180.png">
<link rel="preload" href="/fonts/figtree-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="hills hills--full" data-hills></div>
<div class="auth-shell">
  <div class="auth-card">
    <a class="brand" href="/" style="margin-bottom:18px"><img src="/brand/logo-ink-330.webp" alt="Videokr" width="110" height="30"></a>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login" type="button">Sign in</button>
      <button class="auth-tab" data-mode="signup" type="button">Create account</button>
    </div>
    <h1 id="auth-title">Welcome back</h1>
    <p class="muted tiny" id="auth-sub">Sign in to your workspace to manage videos and embeds.</p>

    <form id="auth-form" novalidate>
      <div class="field hidden" id="name-field">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="At least 8 characters" required>
      </div>
      <div class="form-error" id="auth-error"></div>
      <div class="tiny" id="auth-note" style="margin-bottom:10px"></div>
      <button class="btn" id="auth-submit" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="tiny" id="forgot-row" style="margin-top:14px">
      <a href="#" id="forgot">Forgot your password?</a>
    </p>
  </div>
</div>

<script src="/hills.js"></script>
<script>
(function () {
  var mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';
  var requestedIntent = new URLSearchParams(location.search).get('intent');
  var intent = ['lifetime', 'starter', 'agency'].indexOf(requestedIntent) !== -1 ? requestedIntent : '';
  var tabs = document.querySelectorAll('.auth-tab');
  var nameField = document.getElementById('name-field');
  var title = document.getElementById('auth-title');
  var sub = document.getElementById('auth-sub');
  var submit = document.getElementById('auth-submit');
  var error = document.getElementById('auth-error');
  var form = document.getElementById('auth-form');
  var note = document.getElementById('auth-note');
  var forgotRow = document.getElementById('forgot-row');
  var passwordField = document.getElementById('password').parentNode;

  function render() {
    tabs.forEach(function (tab) { tab.classList.toggle('active', tab.dataset.mode === mode); });
    nameField.classList.toggle('hidden', mode !== 'signup');
    title.textContent = mode === 'signup' ? 'Create your workspace' : 'Welcome back';
    sub.textContent = mode === 'signup'
      ? 'Free forever — no card. Upgrade to lifetime whenever you want.'
      : 'Sign in to your workspace to manage videos and embeds.';
    if (mode === 'forgot') {
      title.textContent = 'Reset your password';
      sub.textContent = 'Give us your email and we will send a link to set a new password.';
      submit.textContent = 'Send the reset link';
    } else {
      submit.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    }
    passwordField.classList.toggle('hidden', mode === 'forgot');
    document.getElementById('password').required = mode !== 'forgot';
    forgotRow.classList.toggle('hidden', mode !== 'login');
    document.getElementById('password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    error.textContent = '';
    note.textContent = '';
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { mode = tab.dataset.mode; render(); });
  });

  document.getElementById('forgot').addEventListener('click', function (event) {
    event.preventDefault();
    mode = 'forgot';
    render();
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.textContent = '';
    note.textContent = '';
    var payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };
    if (mode === 'signup') payload.name = document.getElementById('name').value.trim();
    if (mode === 'forgot') {
      delete payload.password;
      if (!payload.email) {
        error.textContent = 'Your email is required.';
        return;
      }
    } else if (!payload.email || !payload.password) {
      error.textContent = 'Email and password are required.';
      return;
    }
    submit.disabled = true;
    fetch('/api/auth/' + mode, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        submit.disabled = false;
        if (!result.ok) {
          error.textContent = result.body.error || 'Something went wrong.';
          return;
        }
        if (mode === 'forgot') {
          /* The answer is the same for an unknown address, so nobody can probe
             for accounts from this form. */
          note.textContent = 'If that email has an account, the reset link is on its way. It expires in an hour.';
          return;
        }
        location.href = '/app.html' + (intent ? '?intent=' + intent : '');
      })
      .catch(function () {
        submit.disabled = false;
        error.textContent = 'Network error, please retry.';
      });
  });

  render();

  /* An existing session means there is nothing to sign into. */
  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (res) { return res.json(); })
    .then(function (result) {
      if (result.user) location.replace('/app.html' + (intent ? '?intent=' + intent : ''));
    })
    .catch(function () { /* stay on the form */ });
})();
</script>
</body>
</html>
