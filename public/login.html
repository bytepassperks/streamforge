<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Videokr</title>
<link rel="icon" href="/brand/mark-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a class="brand" href="/" style="margin-bottom:18px"><img src="/brand/logo-lockup.png" alt="Videokr"></a>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login" type="button">Sign in</button>
      <button class="auth-tab" data-mode="signup" type="button">Create account</button>
    </div>
    <h1 id="auth-title">Welcome back</h1>
    <p class="muted tiny" id="auth-sub">Sign in to your workspace to manage videos and embeds.</p>

    <form id="auth-form" novalidate>
      <div class="field hidden" id="name-field">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="At least 8 characters" required>
      </div>
      <div class="form-error" id="auth-error"></div>
      <button class="btn" id="auth-submit" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>

<script>
(function () {
  var mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';
  var tabs = document.querySelectorAll('.auth-tab');
  var nameField = document.getElementById('name-field');
  var title = document.getElementById('auth-title');
  var sub = document.getElementById('auth-sub');
  var submit = document.getElementById('auth-submit');
  var error = document.getElementById('auth-error');
  var form = document.getElementById('auth-form');

  function render() {
    tabs.forEach(function (tab) { tab.classList.toggle('active', tab.dataset.mode === mode); });
    nameField.classList.toggle('hidden', mode !== 'signup');
    title.textContent = mode === 'signup' ? 'Create your workspace' : 'Welcome back';
    sub.textContent = mode === 'signup'
      ? 'Free forever — no card. Upgrade to lifetime whenever you want.'
      : 'Sign in to your workspace to manage videos and embeds.';
    submit.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    document.getElementById('password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    error.textContent = '';
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { mode = tab.dataset.mode; render(); });
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.textContent = '';
    var payload = {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };
    if (mode === 'signup') payload.name = document.getElementById('name').value.trim();
    if (!payload.email || !payload.password) {
      error.textContent = 'Email and password are required.';
      return;
    }
    submit.disabled = true;
    fetch('/api/auth/' + mode, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        submit.disabled = false;
        if (!result.ok) {
          error.textContent = result.body.error || 'Something went wrong.';
          return;
        }
        location.href = '/app.html';
      })
      .catch(function () {
        submit.disabled = false;
        error.textContent = 'Network error, please retry.';
      });
  });

  render();
})();
</script>
</body>
</html>
