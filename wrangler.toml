name = "streamforge"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "streamforge"
database_id = "0d0cb759-f16a-4c56-a10c-e5a9843673ab"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "streamforge-media"

[triggers]
# Daily so a failed overage collection retries without waiting for the next month.
crons = ["20 3 * * *"]

[vars]
APP_NAME = "Videokr"
PUBLIC_BASE_URL = "https://streamforge.getlaunchpod.workers.dev"
