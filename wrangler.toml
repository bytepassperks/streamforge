name = "streamforge"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
# Explicit: declaring routes otherwise takes the workers.dev name down, and old
# embeds still point at it.
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
# The Worker sees every request, including asset paths: host canonicalisation has
# to apply to `/` and `/app.html` too, and the assets layer would answer those
# before the Worker ever ran.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "streamforge"
database_id = "0d0cb759-f16a-4c56-a10c-e5a9843673ab"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "streamforge-media"

# The domain is bound to the Worker directly; the workers.dev name stays live and
# redirects, so embeds published before the move keep playing.
[[routes]]
pattern = "videokr.com"
custom_domain = true

[[routes]]
pattern = "www.videokr.com"
custom_domain = true

[triggers]
# Daily so a failed overage collection retries without waiting for the next month.
crons = ["20 3 * * *"]

[vars]
APP_NAME = "Videokr"
PUBLIC_BASE_URL = "https://videokr.com"
# A real Dodo discount code, pre-applied to the lifetime cart. Clearing the code
# ends the promo everywhere at once: quotes, the buy button and the checkout.
LIFETIME_DISCOUNT_CODE = "VIDEOKR10"
LIFETIME_DISCOUNT_USD = "10"
LIFETIME_DISCOUNT_INR = "850"
# The GA4 web stream for videokr.com. A measurement ID is public by design.
GA_MEASUREMENT_ID = "G-N103BBM2MK"
# IndexNow: the protocol requires this exact value to be served publicly at
# /{key}.txt, so it lives with the config rather than with the secrets.
INDEXNOW_KEY = "3becd3beeff4d236a4c1eb3177ac86d4"
